<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Presenter · ¿ÉXITO O FRACASO?</title>
<style>
body{padding:0}.w{max-width:1500px;margin:0 auto;padding:14px 20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:2rem;letter-spacing:.08em;background:linear-gradient(90deg,var(--o),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.g{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;margin-top:10px}@media(max-width:1000px){.g{grid-template-columns:1fr}}
.card{background:var(--k2);border:1px solid #ff2d7533;border-radius:18px;padding:16px}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin:8px 0}#link{word-break:break-all;color:var(--o);font-weight:700}
.stat{font-family:'Bebas Neue',Impact,sans-serif;font-size:3rem;line-height:1}
.cd{font-family:'Bebas Neue',Impact,sans-serif;font-size:6rem;line-height:1;color:var(--o);margin:4px 0 10px}
.bar{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:1.25rem}.bl{width:300px;flex:none}.bn{width:50px;text-align:right;font-weight:700}
.bt{flex:1;height:26px;background:#ffffff1a;border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o),var(--p),var(--r));transition:width .6s}
.concept{background:#ffffff12;border-left:5px solid var(--o);border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.lr{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff18}.lr b{flex:1}.lr em{font-style:normal;color:var(--o);font-weight:700}
#lb{max-height:480px;overflow:auto}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}.ctl .btn{font-size:1rem;padding:12px 20px}.ctl input{width:70px;margin:0;padding:10px;font-size:1rem}
.pod{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:20px}
.pd{width:160px;background:linear-gradient(180deg,var(--p),var(--r));border-radius:14px 14px 0 0;text-align:center;padding:12px;animation:fade .8s both}.pd .m{font-size:3rem}.pd span{display:block}
.p0{height:240px}.p1{height:180px}.p2{height:140px}
#lg{position:fixed;inset:0;background:var(--k);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
</style></head><body>
<div id="lg"><h2>Presenter login</h2><input id="pin" type="password" placeholder="Presenter PIN" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Enter</button><p class="msg" id="le"></p></div>
<div class="w"><div class="top"><span class="logo">¿ÉXITO O FRACASO? · PRESENTER</span><span class="pill" id="st">–</span></div>
<div class="g">
<div class="card"><div class="kicker">Join here</div><div id="qr"></div><div id="link"></div><p class="sub" style="margin-top:10px">Players joined</p><div class="stat" id="np">0</div><p class="sub" style="margin-top:10px">Answers this round</p><div class="stat" id="na">0 / 0</div></div>
<div class="card" id="stage"></div>
<div class="card"><div class="kicker">Players &amp; live leaderboard</div><div id="lb"></div></div></div>
<div class="ctl"><button class="btn" id="b-start" onclick="go('start')">1 · Start game</button><button class="btn" id="b-open" onclick="go('open')">2 · Open round</button>
<input id="secs" type="number" value="20" min="5" max="60" title="Seconds"><button class="btn" id="b-close" onclick="go('close')">3 · Close answers</button>
<button class="btn" id="b-reveal" onclick="go('reveal')">4 · Reveal results</button><button class="btn" id="b-next" onclick="go('next')">5 · Next round</button>
<button class="btn" id="b-final" onclick="go('final')">🏆 Show final winner</button><button class="btn" style="background:#333;box-shadow:none" onclick="go('reset')">Reset game</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="game.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let pin=sessionStorage.pin||'',G={status:'lobby',round:0},P=[],cnt=[0,0,0],skey='',busy=false;
async function login(){const p=$('#pin').value||pin;const{data}=await sb.rpc('admin_check',{pin:p});
 if(data===true){pin=p;sessionStorage.pin=p;$('#lg').remove();start()}else{$('#le').textContent='Wrong PIN (or schema.sql not run)'}}
function start(){const u=location.origin+'/';$('#link').textContent=u;new QRCode($('#qr'),{text:u,width:220,height:220,colorDark:'#000',colorLight:'#fff'});
 if(/localhost|127\.0\.0\.1/.test(u))$('#link').insertAdjacentHTML('afterend','<p class="msg">⚠️ localhost: phones cannot open this. Use the deployed URL.</p>');
 live(refresh);refresh();setInterval(tick,250);setInterval(poll,1000)}
async function refresh(){try{G=await getState();P=await getPlayers()}catch(e){return}render()}
const act=async(st,rnd,secs)=>{const{error}=await sb.rpc('admin_set',{pin,st,rnd,secs});if(error)alert(error.message);refresh()};
async function go(a){const r=G.round;
 if(a==='start')act('ready',1,0);
 if(a==='open')act('open',r,+$('#secs').value||20);
 if(a==='close')act('closed',r,0);
 if(a==='reveal'){const{error}=await sb.rpc('admin_reveal',{pin});if(error)alert(error.message);refresh()}
 if(a==='next')act('ready',r+1,0);
 if(a==='final')act('final',r,0);
 if(a==='reset'&&confirm('Delete all players and answers?')){await sb.rpc('admin_reset',{pin});skey='';refresh()}}
function ctl(){const s=G.status,r=G.round,on={start:s==='lobby',open:s==='ready',close:s==='open',reveal:s==='closed',next:s==='revealed'&&r<5,final:s==='revealed'&&r===5};
 for(const k in on)$('#b-'+k).disabled=!on[k]}
function render(){const s=G.status,r=G.round,key=s+r;
 $('#st').textContent=s.toUpperCase()+(r?' · ROUND '+r+'/5':'');$('#np').textContent=P.length;
 if(key!==skey||s==='lobby'||s==='final'){if(key!==skey)cnt=[0,0,0];skey=key;stage()}
 $('#lb').innerHTML=P.map((p,i)=>`<div class="lr"><span>${MED[i]||i+1}</span><b>${esc(p.name)}</b><em>${p.score}</em></div>`).join('');ctl()}
function stage(){const s=G.status,r=G.round,R=ROUNDS[r-1],E=$('#stage');
 if(s==='lobby')E.innerHTML=`<h2>Waiting for players…</h2><p class="sub">Scan the QR code. ${P.length} joined.</p>${P.map(p=>'<span class="pill">'+esc(p.name)+'</span>').join('')}`;
 else if(s==='final'){const t=P.slice(0,3);E.innerHTML=`<h2>🏆 Winner: ${t[0]?esc(t[0].name):'–'}</h2><div class="pod">${[1,0,2].filter(i=>t[i]).map(i=>`<div class="pd p${i}"><div class="m">${MED[i]}</div><b>${esc(t[i].name)}</b><span>${t[i].score} pts</span></div>`).join('')}</div>`}
 else E.innerHTML=`<div class="kicker">Round ${r} · ${R.k}</div><h2>${R.q}</h2><div class="cd" id="cd"></div>${R.o.map((o,i)=>`<div class="bar"><span class="bl">${o.e} ${o.t}</span><div class="bt"><i id="b${i}"></i></div><span class="bn" id="n${i}">0</span></div>`).join('')}${s==='revealed'?'<div class="concept">💡 '+R.c+'</div>':''}`;
 bars()}
function bars(){const tot=cnt.reduce((a,b)=>a+b,0);$('#na').textContent=tot+' / '+P.length;
 cnt.forEach((n,i)=>{const b=$('#b'+i);if(b){b.style.width=(tot?n/tot*100:0)+'%';$('#n'+i).textContent=n}})}
async function poll(){if(!G.round||!['open','closed','revealed'].includes(G.status))return;
 const{data}=await sb.rpc('admin_counts',{pin,r:G.round});cnt=[0,0,0];(data||[]).forEach(x=>cnt[x.choice]=Number(x.n));bars()}
function tick(){const c=$('#cd');if(c)c.textContent=G.status==='open'?left(G):G.status==='ready'?'Ready':G.status==='closed'?'Closed':'✔';
 if(G.status==='open'&&left(G)===0&&!busy){busy=true;act('closed',G.round,0).finally(()=>busy=false)}}
if(pin)login();
</script></body></html>
